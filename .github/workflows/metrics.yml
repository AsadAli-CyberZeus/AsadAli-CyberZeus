name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics.svg
      - name: Generate profile contribution card
        shell: bash
        run: |
          mkdir -p assets
          curl --fail --location --silent --show-error \
            "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${{ github.repository_owner }}&theme=github_dark" \
            --output assets/profile-details.svg
          sed -E -i 's/Joined GitHub [^<]+/Joined GitHub in 2025/' assets/profile-details.svg
          grep -q 'Joined GitHub in 2025' assets/profile-details.svg
      - name: Commit metrics and profile card
        uses: EndBug/add-and-commit@v9
        with:
          message: "Generate GitHub metrics and profile card"
          add: '["github-metrics.svg", "assets/profile-details.svg"]'
