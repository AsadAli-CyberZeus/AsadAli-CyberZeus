name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics.svg
      - name: Generate private-aware profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false
          THEME: github_dark
      - name: Normalize profile joining year
        shell: bash
        run: |
          sed -E -i 's/Joined GitHub [^<]+/Joined GitHub in 2025/' profile-summary-card-output/github_dark/0-profile-details.svg
          grep -q 'Joined GitHub in 2025' profile-summary-card-output/github_dark/0-profile-details.svg
      - name: Commit metrics and profile card
        uses: EndBug/add-and-commit@v9
        with:
          message: "Generate GitHub metrics and profile card"
          add: '["github-metrics.svg", "profile-summary-card-output/github_dark"]'
