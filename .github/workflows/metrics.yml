name: Generate GitHub metrics

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 12
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics.svg
          output_action: none
      - name: Generate live engineering dashboard
        env:
          DASHBOARD_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/generate_live_dashboard.py
      - name: Commit metrics and live dashboard
        uses: EndBug/add-and-commit@v9
        with:
          message: "Refresh GitHub metrics and live engineering dashboard"
          add: '["github-metrics.svg", "assets/live-engineering-signal.svg"]'